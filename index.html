<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>У фонаря — генератор выбора</title>
<style>
  :root{
    --paper:#f3eee4;
    --card:#fffdf8;
    --ink:#2b2620;
    --ink-soft:#7a7064;
    --line:#e4dbcb;
    --accent:#8c6b3f;
    --accent-2:#c0a375;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family: Georgia, "Times New Roman", serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 520px at 50% -12%, #fffaf1 0%, rgba(255,250,241,0) 62%),
      var(--paper);
    -webkit-font-smoothing:antialiased;
  }

  .app{ max-width:1120px; margin:0 auto; padding:26px 20px 48px; }

  header{
    display:flex; align-items:center; gap:14px;
    padding-bottom:20px; margin-bottom:26px;
    border-bottom:1px solid var(--line);
  }
  .mark{ color:var(--accent); display:flex; filter:drop-shadow(0 2px 6px rgba(140,107,63,.25)); }
  h1{
    margin:0; font-size:25px; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase;
  }
  .brand p{
    margin:5px 0 0; font-family:var(--sans); font-size:11px;
    letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft);
  }

  .layout{
    display:grid;
    grid-template-columns: 1.1fr 1fr;
    gap:20px;
    align-items:stretch;
  }
  @media (max-width:860px){
    .layout{ grid-template-columns:1fr; }
  }

  .side{
    display:flex;
    flex-direction:column;
    gap:20px;
    min-width:0;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    box-shadow: 0 1px 0 rgba(255,255,255,.8) inset,
                0 14px 34px -26px rgba(60,45,25,.75);
    display:flex;
    flex-direction:column;
  }
  .panel h2{
    margin:0 0 16px; display:flex; align-items:center; gap:10px;
    font-family:var(--sans); font-size:11px; font-weight:600;
    letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft);
  }
  .panel h2::after{ content:''; flex:1; height:1px; background:var(--line); }

  .wheel-panel{ min-height:420px; }
  .wheel-wrap{
    position:relative;
    flex:1;
    display:flex; align-items:center; justify-content:center;
    padding:24px 0 16px;
    min-height:0;
  }
  #wheel{ display:block; border-radius:50%; }
  .pointer{
    position:absolute; top:4px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:11px solid transparent;
    border-right:11px solid transparent;
    border-top:20px solid var(--accent);
    filter:drop-shadow(0 3px 5px rgba(60,45,25,.35));
    z-index:3; pointer-events:none;
  }
  .pointer::after{
    content:''; position:absolute; left:-4px; top:-13px;
    width:8px; height:8px; border-radius:50%;
    background:var(--card); border:1.5px solid var(--accent);
  }

  .cubes{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(94px,1fr));
    gap:10px;
  }
  .cube{
    display:flex; align-items:center; justify-content:center;
    min-height:56px; padding:10px 8px;
    text-align:center;
    font-family:var(--sans); font-size:12.5px; line-height:1.25;
    color:var(--ink-soft);
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow: 0 3px 0 #eae1d0, 0 8px 16px -12px rgba(60,45,25,.9);
    transition: transform .16s ease, box-shadow .16s ease,
                background .16s ease, color .16s ease, border-color .16s ease;
    user-select:none;
  }
  .cube.active{
    background:var(--ink); color:#f7f1e6; border-color:var(--ink);
    transform:translateY(-3px);
    box-shadow: 0 6px 0 #191510, 0 14px 22px -14px rgba(40,30,18,.9);
  }

  .result-panel{ margin-top:0; }
  .result-inline{
    display:flex;
    align-items:flex-end;
    gap:22px;
    flex-wrap:wrap;
  }
  .result-item{
    display:flex; flex-direction:column; gap:4px;
    flex:1 1 130px;
    min-width:0;
  }
  .result-label{
    font-family:var(--sans); font-size:10px; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft);
    white-space:nowrap;
  }
  .result-item strong{
    font-size:18px; font-weight:600; letter-spacing:.01em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .result-item strong.flash{ animation: flash .5s ease; }
  @keyframes flash{
    from{ opacity:0; transform:translateY(5px); }
    to{ opacity:1; transform:none; }
  }

  .actions{
    display:flex; gap:10px; align-items:center;
    margin-left:auto;
  }

  button{ font-family:var(--sans); cursor:pointer; border:none; background:none; }
  .primary{
    padding:14px 26px; border-radius:11px;
    background:var(--ink); color:#f7f1e6;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
    transition: .18s ease;
    box-shadow: 0 4px 0 #191510, 0 12px 22px -14px rgba(40,30,18,.9);
    white-space:nowrap;
  }
  .primary:hover:not(:disabled){ background:#3c332b; transform:translateY(-1px); }
  .primary:active:not(:disabled){ transform:translateY(2px); box-shadow:0 2px 0 #191510; }
  .primary:disabled{ opacity:.55; cursor:default; box-shadow:none; }

  .ghost{
    padding:12px 16px; border-radius:11px;
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
    transition:.18s ease;
    white-space:nowrap;
  }
  .ghost:hover:not(:disabled){ color:var(--ink); border-color:var(--accent-2); background:#fdfaf4; }
  .ghost:disabled{ opacity:.45; cursor:default; }

  @media (max-width:640px){
    .result-inline{ align-items:stretch; }
    .result-item{ flex-basis:100%; }
    .actions{ margin-left:0; width:100%; }
    .actions .primary{ flex:1; }
  }

  .foot{
    margin-top:26px; text-align:center;
    font-family:var(--sans); font-size:11.5px; color:var(--ink-soft); letter-spacing:.04em;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <span class="mark">
      <svg width="38" height="38" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M20 4v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M14.5 7h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M14 10h12l2 17.6a3 3 0 0 1-3 3.4H15a3 3 0 0 1-3-3.4L14 10Z"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M13 14h14" stroke="currentColor" stroke-width="1" opacity=".3"/>
        <circle cx="20" cy="21" r="4.4" fill="currentColor" opacity=".22"/>
        <circle cx="20" cy="21" r="1.7" fill="currentColor"/>
      </svg>
    </span>
    <div>
      <h1>У фонаря</h1>
      <p>кофейня · генератор выбора</p>
    </div>
  </header>

  <main class="layout">
    <section class="panel wheel-panel">
      <h2>Напиток</h2>
      <div class="wheel-wrap">
        <canvas id="wheel"></canvas>
        <div class="pointer"></div>
      </div>
    </section>

    <div class="side">
      <section class="panel">
        <h2>Молоко</h2>
        <div class="cubes" id="milkCubes"></div>
      </section>

      <section class="panel">
        <h2>Сироп</h2>
        <div class="cubes" id="syrupCubes"></div>
      </section>

      <section class="panel result-panel">
        <h2>Ваш заказ</h2>
        <div class="result-inline">
          <div class="result-item">
            <span class="result-label">Напиток</span>
            <strong id="resDrink">—</strong>
          </div>
          <div class="result-item">
            <span class="result-label">Молоко</span>
            <strong id="resMilk">—</strong>
          </div>
          <div class="result-item">
            <span class="result-label">Сироп</span>
            <strong id="resSyrup">—</strong>
          </div>
          <div class="actions">
            <button class="primary" id="pickBtn">Сделать выбор</button>
            <button class="ghost" id="resetBtn">Сбросить</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <p class="foot">Нажмите «Сделать выбор» — колесо крутится, затем бросаются кубики.</p>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     НАСТРОЙКИ — меняйте здесь
     ------------------------------------------------------------
     drinks — список напитков. Для каждого:
       name    — название (видно на колесе)
       milks   — список молок, допустимых для напитка
                 ('all' = все из CONFIG.milks)
       syrups  — список сиропов по умолчанию
                 ('all' = все из CONFIG.syrups)
       pairing — (необязательно) уточнение по конкретному молоку:
                 { 'Название молока': [ ...сиропы ] }
                 Если для выбранного молока есть ключ — используется
                 именно этот список сиропов, иначе — drink.syrups.

     milks  — общий список молок (порядок влияет на кубики)
     syrups — общий список сиропов
     ============================================================ */
  const CONFIG = {
    milks: [
      'Молоко кокос',
      'Молоко банан',
      'Молоко орех',
      'Без молока'
    ],

    syrups: [
      'Лаванда',
      'ваниль',
      'вишня',
      'дыня',
      'клубника',
      'амаретто',
      'кленовый',
      'малина',
      'Тоффи',
      'карамель',
      'шоколад',
      'мята',
      'кокос',
      'лесной орех',
      'солёный карамель',
      'чёрная смородина',
      'Без сиропа'
    ],

    drinks: [
      {
        name: 'Капучино',
        milks: ['Молоко кокос', 'Молоко банан', 'Молоко орех'],
        syrups: ['ваниль', 'карамель', 'лесной орех', 'кокос',
                 'солёный карамель', 'Тоффи', 'шоколад', 'амаретто']
      },
      {
        name: 'Латте',
        milks: ['Молоко кокос', 'Молоко банан', 'Молоко орех'],
        syrups: ['ваниль', 'карамель', 'лесной орех', 'кокос',
                 'лаванда', 'солёный карамель', 'Тоффи',
                 'кленовый', 'малина'],
        pairing: {
          'Молоко банан': ['ваниль', 'карамель', 'шоколад',
                           'лесной орех', 'Тоффи', 'клубника'],
          'Молоко кокос': ['ваниль', 'карамель', 'кокос', 'лаванда',
                           'Тоффи', 'солёный карамель'],
          'Молоко орех':  ['ваниль', 'карамель', 'лесной орех',
                           'кленовый', 'Тоффи']
        }
      },
      {
        name: 'Флэт уайт',
        milks: ['Молоко кокос', 'Молоко орех'],
        syrups: ['ваниль', 'карамель', 'лесной орех', 'кокос']
      },
      {
        name: 'Раф',
        milks: ['Молоко кокос', 'Молоко банан', 'Молоко орех'],
        syrups: ['ваниль', 'лаванда', 'карамель', 'солёный карамель',
                 'кленовый', 'кокос', 'лесной орех']
      },
      {
        name: 'Мокочино',
        milks: ['Молоко кокос', 'Молоко банан', 'Молоко орех'],
        syrups: ['шоколад', 'карамель', 'лесной орех', 'мята',
                 'кокос', 'Тоффи', 'солёный карамель', 'амаретто'],
        pairing: {
          'Молоко банан': ['шоколад', 'карамель', 'лесной орех',
                           'Тоффи', 'клубника'],
          'Молоко кокос': ['шоколад', 'карамель', 'кокос',
                           'Тоффи', 'солёный карамель']
        }
      },
      {
        name: 'Горячий шоколад',
        milks: ['Молоко кокос', 'Молоко банан', 'Молоко орех'],
        syrups: ['шоколад', 'карамель', 'мята', 'лесной орех',
                 'Тоффи', 'солёный карамель', 'кокос', 'амаретто'],
        pairing: {
          'Молоко банан': ['шоколад', 'карамель', 'лесной орех',
                           'Тоффи', 'клубника'],
          'Молоко кокос': ['шоколад', 'карамель', 'кокос',
                           'Тоффи', 'солёный карамель']
        }
      },
      {
        name: 'Какао',
        milks: ['Молоко кокос', 'Молоко банан', 'Молоко орех'],
        syrups: ['шоколад', 'карамель', 'мята', 'ваниль', 'лесной орех']
      },
      {
        name: 'Матча латте',
        milks: ['Молоко кокос', 'Молоко банан', 'Молоко орех'],
        syrups: ['ваниль', 'лаванда', 'кокос', 'дыня',
                 'клубника', 'малина'],
        pairing: {
          'Молоко банан': ['ваниль', 'кокос', 'дыня',
                           'клубника', 'малина'],
          'Молоко кокос': ['ваниль', 'лаванда', 'кокос', 'дыня'],
          'Молоко орех':  ['ваниль', 'лаванда', 'кокос', 'дыня', 'клубника']
        }
      },
      {
        name: 'Облепиховый напиток',
        milks: ['Молоко кокос', 'Молоко орех', 'Без молока'],
        syrups: ['ваниль', 'кленовый', 'дыня', 'мята',
                 'лаванда', 'вишня']
      },
      {
        name: 'Ежевичный напиток',
        milks: ['Молоко кокос', 'Молоко орех', 'Без молока'],
        syrups: ['вишня', 'малина', 'клубника', 'чёрная смородина',
                 'ваниль', 'лаванда']
      },
      {
        name: 'Авторский с халвой',
        milks: ['Молоко кокос', 'Молоко банан', 'Молоко орех'],
        syrups: ['ваниль', 'лесной орех', 'кленовый', 'карамель',
                 'шоколад', 'Тоффи'],
        pairing: {
          'Молоко кокос': ['ваниль', 'карамель', 'шоколад', 'Тоффи'],
          'Молоко орех':  ['ваниль', 'лесной орех', 'кленовый',
                           'карамель', 'шоколад', 'Тоффи']
        }
      },
      {
        name: 'Цитрусовый раф',
        milks: ['Молоко кокос', 'Молоко банан'],
        syrups: ['ваниль', 'карамель', 'малина', 'клубника',
                 'дыня', 'лаванда']
      },
      {
        name: 'Сырный раф',
        milks: ['Молоко кокос', 'Молоко орех'],
        syrups: ['ваниль', 'карамель', 'кленовый',
                 'лесной орех', 'кокос']
      },
      {
        name: 'Ореховый раф',
        milks: ['Молоко кокос', 'Молоко банан', 'Молоко орех'],
        syrups: ['лесной орех', 'кленовый', 'карамель',
                 'шоколад', 'ваниль', 'Тоффи', 'кокос', 'амаретто'],
        pairing: {
          'Молоко кокос': ['лесной орех', 'карамель', 'шоколад',
                           'Тоффи', 'кокос'],
          'Молоко банан': ['карамель', 'шоколад', 'ваниль', 'Тоффи']
        }
      }
    ],

    wheel: {
      spinDurationMs: 3200,
      extraTurnsMin: 5,
      extraTurnsMax: 7,
      palette: [
        { bg: '#403830', fg: '#f7f1e6' },
        { bg: '#e7dbc8', fg: '#3a322a' },
        { bg: '#9c8464', fg: '#fffaf2' },
        { bg: '#f4ece0', fg: '#3a322a' },
        { bg: '#6e6052', fg: '#f7f1e6' },
        { bg: '#cdb894', fg: '#3a322a' },
        { bg: '#5a4a3a', fg: '#f7f1e6' },
        { bg: '#d9c9a8', fg: '#3a322a' }
      ]
    },

    dice: {
      minTicks: 10,
      maxTicks: 16,
      baseDelayMs: 40,
      extraDelayMs: 200,
      delayPower: 3,
      singlePauseMs: 320
    }
  };
  /* ============================================================ */

  const TAU = Math.PI * 2;

  function getAllowedMilks(drink) {
    if (!drink) return CONFIG.milks.slice();

    const allowed = drink.milks;

    if (allowed == null || allowed === 'all') return CONFIG.milks.slice();

    const filtered = CONFIG.milks.filter(function (m) {
      return allowed.indexOf(m) !== -1;
    });

    return filtered.length ? filtered : ['Без молока'];
  }

  function getAllowedSyrups(drink, milk) {
    if (!drink) return CONFIG.syrups.slice();

    let allowed = drink.syrups;

    if (drink.pairing &&
        milk &&
        Object.prototype.hasOwnProperty.call(drink.pairing, milk)) {
      allowed = drink.pairing[milk];
    }

    if (allowed == null || allowed === 'all') return CONFIG.syrups.slice();

    const filtered = CONFIG.syrups.filter(function (s) {
      return allowed.indexOf(s) !== -1;
    });

    return filtered.length ? filtered : ['Без сиропа'];
  }

  function colorFor(i, n) {
    const palette = CONFIG.wheel.palette;
    let idx = i % palette.length;

    if (i === n - 1 && n % palette.length === 1 && palette.length > 2) {
      idx = 2;
    }
    return palette[idx];
  }

  const state = {
    rotation: 0,
    busy: false,
    drink: null,
    milk: null,
    syrup: null
  };

  const canvas      = document.getElementById('wheel');
  const ctx         = canvas.getContext('2d');
  const wrap        = canvas.parentElement;

  const milkCubesEl = document.getElementById('milkCubes');
  const syrupCubesEl= document.getElementById('syrupCubes');

  const resDrink    = document.getElementById('resDrink');
  const resMilk     = document.getElementById('resMilk');
  const resSyrup    = document.getElementById('resSyrup');

  const pickBtn     = document.getElementById('pickBtn');
  const resetBtn    = document.getElementById('resetBtn');

  let size = 0;
  let R = 0;

  function resize() {
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    if (!w || !h) return;

    const s = Math.floor(Math.min(w, h - 40, 480));
    if (s < 80 || s === size) return;

    size = s;
    const dpr = window.devicePixelRatio || 1;

    canvas.width  = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    canvas.style.width  = size + 'px';
    canvas.style.height = size + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = size / 2 - 6;
    draw();
  }

  function draw() {
    if (size < 10) return;

    const drinks = CONFIG.drinks;
    const n = drinks.length;
    const c = size / 2;

    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.translate(c, c);

    ctx.beginPath();
    ctx.arc(0, 0, R + 3, 0, TAU);
    ctx.fillStyle = 'rgba(80,62,40,.06)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, R + 1, 0, TAU);
    ctx.fillStyle = '#fffdf8';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#e4dbcb';
    ctx.stroke();

    if (n > 0) {
      const seg = TAU / n;

      ctx.save();
      ctx.rotate(state.rotation);

      for (let i = 0; i < n; i++) {
        const a0 = -Math.PI / 2 + i * seg;
        const a1 = a0 + seg;
        const col = colorFor(i, n);

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, R - 1, a0, a1);
        ctx.closePath();
        ctx.fillStyle = col.bg;
        ctx.fill();

        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255,253,248,.55)';
        ctx.stroke();
      }

      const fs = Math.max(9, Math.min(15, R * 0.075));
      ctx.font = '600 ' + fs + 'px Georgia, "Times New Roman", serif';
      ctx.textBaseline = 'middle';

      const outer = R - 14;
      const maxW  = outer - R * 0.30;

      for (let i = 0; i < n; i++) {
        const mid = -Math.PI / 2 + (i + 0.5) * seg;
        const col = colorFor(i, n);

        ctx.save();
        ctx.rotate(mid);

        const flip = Math.cos(mid + state.rotation) < 0;
        if (flip) ctx.rotate(Math.PI);

        ctx.fillStyle = col.fg;
        ctx.textAlign = flip ? 'left' : 'right';

        let label = drinks[i].name;
        if (ctx.measureText(label).width > maxW) {
          while (label.length > 1 &&
                 ctx.measureText(label + '…').width > maxW) {
            label = label.slice(0, -1);
          }
          label += '…';
        }
        ctx.fillText(label, flip ? -outer : outer, 0);
        ctx.restore();
      }

      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(0, 0, Math.max(18, R * 0.15), 0, TAU);
    ctx.fillStyle = '#fffdf8';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(140,107,63,.4)';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, 2.6, 0, TAU);
    ctx.fillStyle = 'rgba(140,107,63,.55)';
    ctx.fill();

    ctx.restore();
  }

  function renderCubes(container, items) {
    container.innerHTML = '';
    items.forEach(function (name) {
      const d = document.createElement('div');
      d.className = 'cube';
      d.textContent = name;
      container.appendChild(d);
    });
  }

  function setActiveCube(container, index) {
    const list = container.children;
    for (let k = 0; k < list.length; k++) {
      list[k].classList.remove('active');
    }
    if (list[index]) list[index].classList.add('active');
  }

  function setResult(el, value) {
    el.textContent = value || '—';
    el.classList.remove('flash');
    if (value) {
      void el.offsetWidth;
      el.classList.add('flash');
    }
  }

  function spinWheel() {
    return new Promise(function (resolve) {
      const drinks = CONFIG.drinks;
      const n = drinks.length;
      if (n === 0) { resolve(null); return; }

      const seg = TAU / n;
      const target = Math.floor(Math.random() * n);

      const start = state.rotation;
      const cur = ((start % TAU) + TAU) % TAU;
      const desired = ((-(target + 0.5) * seg) % TAU + TAU) % TAU;
      const delta = (desired - cur + TAU) % TAU;

      const turns = CONFIG.wheel.extraTurnsMin +
        Math.floor(Math.random() *
          (CONFIG.wheel.extraTurnsMax - CONFIG.wheel.extraTurnsMin + 1));

      const to = start + turns * TAU + delta;
      const dur = CONFIG.wheel.spinDurationMs;
      const t0 = performance.now();

      function frame(now) {
        const t = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - t, 5);

        state.rotation = start + (to - start) * e;
        draw();

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          state.rotation = ((state.rotation % TAU) + TAU) % TAU;
          draw();
          resolve(drinks[target]);
        }
      }
      requestAnimationFrame(frame);
    });
  }

  function rollCubes(container, items) {
    return new Promise(function (resolve) {
      if (!items.length) { resolve(null); return; }

      if (items.length === 1) {
        setActiveCube(container, 0);
        setTimeout(function () {
          resolve(items[0]);
        }, CONFIG.dice.singlePauseMs);
        return;
      }

      const n = items.length;
      const target = Math.floor(Math.random() * n);
      const total = CONFIG.dice.minTicks +
        Math.floor(Math.random() *
          (CONFIG.dice.maxTicks - CONFIG.dice.minTicks + 1));

      let step = 0;
      let last = -1;

      function tick() {
        if (step >= total) {
          setActiveCube(container, target);
          resolve(items[target]);
          return;
        }

        let r;
        do {
          r = Math.floor(Math.random() * n);
        } while (n > 1 && r === last);

        last = r;
        setActiveCube(container, r);

        step++;
        const p = step / total;
        const delay = CONFIG.dice.baseDelayMs +
          Math.pow(p, CONFIG.dice.delayPower) * CONFIG.dice.extraDelayMs;

        setTimeout(tick, delay);
      }
      tick();
    });
  }

  function setButtonLabel(text) {
    pickBtn.textContent = text;
  }

  function resetResults() {
    state.drink = null;
    state.milk = null;
    state.syrup = null;

    setResult(resDrink, null);
    setResult(resMilk, null);
    setResult(resSyrup, null);

    renderCubes(milkCubesEl, getAllowedMilks(null));
    renderCubes(syrupCubesEl, CONFIG.syrups);
  }

  async function pick() {
    if (state.busy) return;
    state.busy = true;
    pickBtn.disabled = true;
    resetBtn.disabled = true;

    resetResults();

    try {
      // 1. Колесо — напиток
      setButtonLabel('Крутим колесо…');
      const drink = await spinWheel();

      if (!drink) {
        setButtonLabel('Сделать выбор');
        return;
      }

      state.drink = drink;
      setResult(resDrink, drink.name);

      // 2. Кубики — молоко
      setButtonLabel('Выбираем молоко…');
      const milks = getAllowedMilks(drink);
      renderCubes(milkCubesEl, milks);
      await new Promise(function (r) { setTimeout(r, 120); });

      const milk = await rollCubes(milkCubesEl, milks);
      state.milk = milk;
      setResult(resMilk, milk);

      // 3. Кубики — сироп (с учётом выбранного молока)
      setButtonLabel('Выбираем сироп…');
      const syrups = getAllowedSyrups(drink, milk);
      renderCubes(syrupCubesEl, syrups);
      await new Promise(function (r) { setTimeout(r, 120); });

      const syrup = await rollCubes(syrupCubesEl, syrups);
      state.syrup = syrup;
      setResult(resSyrup, syrup);

    } finally {
      state.busy = false;
      pickBtn.disabled = false;
      resetBtn.disabled = false;
      setButtonLabel('Сделать выбор');
    }
  }

  function reset() {
    if (state.busy) return;
    state.rotation = 0;
    resetResults();
    draw();
  }

  pickBtn.addEventListener('click', pick);
  resetBtn.addEventListener('click', reset);

  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(wrap);
  } else {
    window.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  renderCubes(milkCubesEl, CONFIG.milks);
  renderCubes(syrupCubesEl, CONFIG.syrups);
  resize();
})();
</script>
</body>
</html>
